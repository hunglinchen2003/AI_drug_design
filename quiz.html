        { q: "論文怎麼處理配體 7？", options: ["GB0139 是買來的對照，不是每一個對照都要從頭合成", "七個配體都必須用同一條最長路線", "軟體第一名路線即為實驗步驟", "對照分子不需要結構正確"], a: 0, why: "已知抑制劑可以購買來當對照，設計資源放在新的類似物。" }
      ]},
      { title: "親和力、效價、藥效", href: "index.html#s17", questions: [
        { q: "Kd、IC50、最大效果分別對應？", options: ["親和力、效價、藥效", "三個詞完全同義", "都是動物存活率", "都是分子量"], a: 0, why: "Kd 是結合多緊，IC50 是多濃達到一半效果，藥效是效果最大能到多大。" },
        { q: "論文用來互相確認親和力的兩種方法是？", options: ["螢光偏振與等温滴定量熱", "只有西方墨點", "血壓與體重", "專利引用數"], a: 0, why: "FPA 與 ITC 的排序高度一致，ITC 還能看到結合由焓驅動。" },
        { q: "為什麼奈米莫耳 Kd 仍可能沒有細胞或臨床藥效？", options: ["還有通透性、蛋白吸附、細胞內功能與標的佔有", "因為 Kd 越低效果越小", "因為 FPA 不能在溶液中進行", "因為焓驅動的結合一定無活性"], a: 0, why: "GB0139 對純化 CRD 很緊，吸入 IPF 試驗仍然沒有臨床藥效。" }
      ]},
      { title: "胰臟癌動物模式", href: "index.html#s18", questions: [
        { q: "若假說是解除免疫排除，哪一種模式比較對得上？", options: ["免疫系統完整的同基因瘤或 KPC", "只看試管裡的顏色", "只有裸鼠皮下瘤", "不需要對照組"], a: 0, why: "裸鼠皮下瘤容易量體積，但看不到 T 細胞，支持不了免疫假說。" },
        { q: "血清 Galectin-3 在動物實驗裡適合？", options: ["當伴隨數據，不能單獨當成標的佔有", "取代腫瘤測量", "證明藥物已經結合 CRD", "取代實驗動物委員會審查"], a: 0, why: "GALACTIC-1 已顯示這個濃度會誤導。" },
        { q: "針對人 CRD 設計的分子，進鼠模式前要額外確認？", options: ["它認不認鼠的 Galectin-3", "鼠的毛色", "分子是否一定含氟", "能不能省略所有對照"], a: 0, why: "人與鼠的 CRD 相似，但不代表每一個取代基都保留親和力。" }
      ]},
      { title: "專利檢索", href: "index.html#s19", questions: [
        { q: "論文已經公開，代表？", options: ["可以引用來學習，不自動等於可以商業實施", "全世界都可以自由販售該分子", "專利因此失效", "不必再搜 GB0139"], a: 0, why: "學術公開與自由實施是兩件事。" },
        { q: "可專利性與自由實施的差別是？", options: ["前者問你的發明新不新，後者問你會不會踩到別人的請求項", "兩者都只看分子重量", "前者只看動物實驗，後者只看顏色", "兩者都由 docking 分數決定"], a: 0, why: "請求項可能保護化合物，也可能保護某種用途。" },
        { q: "適合開始搜尋的資料庫是？", options: ["Espacenet、Google Patents、PatentScope、USPTO、Lens", "只搜社群媒體", "只看 PDB", "只看 FPA 的原始檔"], a: 0, why: "關鍵字包含 galectin-3、LGALS3、TD139、GB0139、GB1211、belapectin。" }
      ]},
      { title: "臨床試驗規劃", href: "index.html#s20", questions: [
        { q: "進入第一期之前，計畫裡應該已經有？", options: ["Kd、對得上假說的細胞藥效、免疫完整動物的方向，以及安全性與暴露量", "只有一張 docking 圖", "已經招募數百位胰臟癌病人", "上市價格"], a: 0, why: "期別是建立在這些證據之上，不是用來取代它們。" },
        { q: "第一期最主要在看什麼？", options: ["安全性、藥物動力學，以及事先定義好的標的佔有", "直接比較總存活並申請核准", "只看血清 Galectin-3 是否升高", "只重複一次 docking"], a: 0, why: "血清 Galectin-3 升高不能被解讀成藥已經結合。" },
        { q: "第二期若要呼應免疫假說，比較合理的設計是？", options: ["標準治療或免疫治療，隨機加上或不加抑制劑", "沒有對照的個案報告", "改回吸入 GB0139 的同一終點且不測佔有", "只收 Galectin-3 完全不表現的病人"], a: 0, why: "併用設計呼應 GB1211 試驗的方向，也避免把一個尚未證明的單藥說成標準治療。" }
      ]}
    ];

    const storageKey = "gal3-quest-v1";
    const saved = JSON.parse(localStorage.getItem(storageKey) || "{\"stars\":[]}");
    const stars = Array.isArray(saved.stars) ? saved.stars : [];
    while (stars.length < LEVELS.length) stars.push(0);

    const map = document.getElementById("map");
    const stage = document.getElementById("stage");
    const statCleared = document.getElementById("statCleared");
    const statStars = document.getElementById("statStars");
    let active = -1;
    let qIndex = 0;
    let correct = 0;
    let locked = false;

    function clearedCount() { return stars.filter((n) => n >= 2).length; }
    function persist() {
      localStorage.setItem(storageKey, JSON.stringify({ stars }));
      statCleared.textContent = clearedCount() + " / " + LEVELS.length;
      statStars.textContent = stars.reduce((sum, n) => sum + n, 0) + " / " + (LEVELS.length * 3);
    }
    function unlocked(index) { return index === 0 || stars[index - 1] >= 2; }

    function renderMap() {
      map.innerHTML = "";
      LEVELS.forEach((level, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "gate";
        if (!unlocked(index)) button.classList.add("locked");
        if (stars[index] >= 2) button.classList.add("cleared");
        if (index === active) button.classList.add("current");
        const status = !unlocked(index) ? "未解鎖" : stars[index] >= 2 ? "已過關 · " + stars[index] + "/3" : "可挑戰";
        button.innerHTML = "<small>第 " + String(index + 1).padStart(2, "0") + " 關</small><strong></strong><small></small>";
        button.children[1].textContent = level.title;
        button.children[2].textContent = status;
        button.disabled = !unlocked(index);
        button.addEventListener("click", () => startLevel(index));
        map.appendChild(button);
      });
      persist();
    }

    function startLevel(index) {
      active = index;
      qIndex = 0;
      correct = 0;
      locked = false;
      stage.hidden = false;
      renderMap();
      renderQuestion();
      stage.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderQuestion() {
      const level = LEVELS[active];
      const item = level.questions[qIndex];
      stage.innerHTML = "";
      const head = document.createElement("div");
      head.innerHTML = "<div class='progress-pips' id='pips'></div>";
      const title = document.createElement("h2");
      title.textContent = "第 " + (active + 1) + " 關 · " + level.title;
      const prompt = document.createElement("p");
      prompt.textContent = "第 " + (qIndex + 1) + " / 3 題。 " + item.q;
      stage.append(head, title, prompt);
      const pips = head.querySelector("#pips");
      for (let i = 0; i < 3; i += 1) {
        const pip = document.createElement("i");
        if (i <= qIndex) pip.className = "on";
        pips.appendChild(pip);
      }
      const options = document.createElement("div");
      options.className = "options";
      item.options.forEach((text, optionIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = text;
        button.addEventListener("click", () => choose(optionIndex, button, options, item));
        options.appendChild(button);
      });
      stage.appendChild(options);
      const link = document.createElement("p");
      const anchor = document.createElement("a");
      anchor.href = level.href;
      anchor.textContent = "回教學頁這一步";
      link.appendChild(anchor);
      stage.appendChild(link);
    }

    function choose(optionIndex, button, options, item) {
      if (locked) return;
      locked = true;
      const ok = optionIndex === item.a;
      if (ok) correct += 1;
      [...options.children].forEach((node, index) => {
        node.disabled = true;
        if (index === item.a) node.classList.add("right");
        if (index === optionIndex && !ok) node.classList.add("wrong");
      });
      const why = document.createElement("div");
      why.className = "why";
      why.textContent = (ok ? "答對。" : "這題不是這個答案。") + item.why;
      const actions = document.createElement("div");
      actions.className = "q-actions";
      const next = document.createElement("button");
      next.className = "btn";
      next.type = "button";
      next.textContent = qIndex === 2 ? "看本關結果" : "下一題";
      next.addEventListener("click", () => {
        if (qIndex === 2) finishLevel();
        else { qIndex += 1; locked = false; renderQuestion(); }
      });
      actions.appendChild(next);
      stage.append(why, actions);
    }

    function finishLevel() {
      stars[active] = Math.max(stars[active], correct);
      const passed = correct >= 2;
      stage.innerHTML = "";
      const title = document.createElement("h2");
      title.textContent = passed ? "這一關通過了" : "這一關還差一點";
      const text = document.createElement("p");
      text.textContent = "答對 " + correct + " / 3。" + (passed ? "下一關已解鎖。" : "至少要 2 題才會解鎖下一關。");
      const actions = document.createElement("div");
      actions.className = "q-actions";
      const retry = document.createElement("button");
      retry.className = "btn secondary";
      retry.type = "button";
      retry.textContent = "再挑戰一次";
      retry.addEventListener("click", () => startLevel(active));
      actions.appendChild(retry);
      if (passed && active < LEVELS.length - 1) {
        const onward = document.createElement("button");
        onward.className = "btn";
        onward.type = "button";
        onward.textContent = "進入下一關";
        onward.addEventListener("click", () => startLevel(active + 1));
        actions.appendChild(onward);
      }
      if (passed && active === LEVELS.length - 1 && clearedCount() === LEVELS.length) {
        const done = document.createElement("p");
        done.className = "callout";
        done.textContent = "二十關都過了。回到論文 jm6c00031.pdf，把對稱骨架與不對稱骨架的 pose 再對一次。";
        stage.append(title, text, done, actions);
      } else stage.append(title, text, actions);
      renderMap();
    }

    document.getElementById("reset").addEventListener("click", () => {
      stars.fill(0);
      active = -1;
      stage.hidden = true;
      renderMap();
    });
    renderMap();
  </script>
